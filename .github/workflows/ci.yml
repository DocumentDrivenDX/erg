name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      QUALITY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22', cache: npm}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with: {version: '0.13.3', enable-cache: true}
      - run: uv sync --locked
      - run: npm ci
      - run: uv run --locked python scripts/install-gitleaks.py
      - run: npx playwright install --with-deps chromium
      - run: make quality
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: quality-evidence
          path: |
            reports/
            test-results/
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: erg-release-candidate
          path: dist/*
          retention-days: 30
  runtime:
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.8', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '${{ matrix.python }}'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22'}
      - run: python -B scripts/run-tests.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: erg-release-candidate, path: dist}
      - name: Fresh wheel and source installs without runtime dependencies
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/erg-wheel"
          python -m venv "$RUNNER_TEMP/erg-source"
          "$RUNNER_TEMP/erg-wheel/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/erg-source/bin/python" -m pip install --no-deps dist/*.tar.gz
          "$RUNNER_TEMP/erg-wheel/bin/python" -I -B scripts/smoke-installed.py
          "$RUNNER_TEMP/erg-source/bin/python" -I -B scripts/smoke-installed.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: runtime-${{ matrix.os }}-${{ matrix.python }}
          path: reports/
          retention-days: 30
