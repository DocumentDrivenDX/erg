name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: python -B -m unittest discover -s tests -v
      - run: python -B scripts/check-delivery-boundaries.py
      - run: python -m pip install build
      - run: python -m build
      - run: python -B scripts/check-release-artifacts.py
      - name: Fresh wheel and source installs
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/erg-wheel"
          python -m venv "$RUNNER_TEMP/erg-source"
          "$RUNNER_TEMP/erg-wheel/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/erg-source/bin/python" -m pip install --no-deps dist/*.tar.gz
          "$RUNNER_TEMP/erg-wheel/bin/python" -I -B scripts/smoke-installed.py
          "$RUNNER_TEMP/erg-source/bin/python" -I -B scripts/smoke-installed.py
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: erg-release-candidate
          path: dist/*
