[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "erg"
version = "0.1.0rc1"
description = "Local-first usage ledger for coding agents: tokens, costs, work and machine load"
readme = "README.md"
license = {text = "MIT OR Apache-2.0"}
requires-python = ">=3.8"
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]

[project.urls]
Repository = "https://github.com/DocumentDrivenDX/erg"
Issues = "https://github.com/DocumentDrivenDX/erg/issues"

[project.scripts]
erg = "erg.cli:main"

[tool.setuptools]
packages = ["erg"]
include-package-data = false
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]

[tool.setuptools.package-data]
erg = ["static/*.html", "static/*.css", "static/*.js", "static/*.txt", "hooks/*.mjs", "*.json"]

[dependency-groups]
dev = [
    "build==1.6.1",
    "coverage[toml]==7.17.0",
    "hypothesis==6.170.12",
    "pip-audit==2.10.1",
    "pyright==1.1.414",
    "ruff==0.17.3",
    "setuptools==84.2.1",
]

[tool.uv.dependency-groups]
dev = {requires-python = ">=3.12"}

[tool.ruff]
target-version = "py38"
line-length = 100
extend-exclude = [".local-evidence", "dist", "build", "*.egg-info"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = ["erg", "scripts/quality.py", "scripts/quality_rules.py", "scripts/run-tests.py", "scripts/install-gitleaks.py", "scripts/serve-quality-fixture.py"]
exclude = [".venv", "build", "dist"]
pythonVersion = "3.8"
typeCheckingMode = "basic"
strict = ["scripts/quality_rules.py"]

[tool.coverage.run]
branch = true
source = ["erg"]
parallel = true
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true
