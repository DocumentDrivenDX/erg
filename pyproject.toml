[project]
name = "agentusage"
version = "0.1.0"
description = "Local-first token, output and machine-load dashboard for Claude Code, Codex and AI gateways"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []

[project.scripts]
usage = "agentusage.cli:main"

[tool.setuptools]
packages = ["agentusage"]
[tool.setuptools.package-data]
agentusage = ["static/*.html", "collect.py"]
