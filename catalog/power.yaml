# erg model power ranking -- SEED (draft). Pure data; see docs/research/model-power.md.
# Power is fizeau's 1..10 model-strength scale (github.com/easel/fizeau); erg archives it as a
# capability tier for optional token weighting (ADR-001). Power is NOT a price and NOT a routing
# eligibility flag: fizeau's catalog zeroes power on superseded models for pin-only routing; that
# zero is a routing concept and is not copied here (strength values are).
# provenance: reported = read from a fizeau artifact (catalog or benchmark mapping, cited per entry);
# derived = placed by the method below because fizeau has not measured the model yet. Nothing is inferred
# beyond the documented band + anchor + list-price/generation rule; derived entries flip to reported when
# fizeau publishes measurements covering them. Anything not here is NOT ranked: do not invent powers.
schema_version: 0
status: draft
ranking_version: 0.1.0-draft
as_of: '2026-10-16'
scale: 1..10
# fizeau bands (scripts/benchmark/terminalbench_model_power.json): frontier >= 9, medium_frontier 7-8,
# non_frontier 4-6. Deployment-class defaults/caps (internal/modelcatalog/power.go): managed/prepaid
# frontier default 9 cap 10; metered_cloud default 7 cap 10; local_free / community_self_hosted
# default 5 cap 6.
method: >
  reported entries copy fizeau verbatim. derived entries use fizeau's band for the deployment class,
  then pick the band value by (a) the nearest measured predecessor in the same family tier and
  (b) list price + generation ordering from catalog/prices.yaml (as_of 2026-10-16); smaller variants of a
  measured model (nano/lite/luna/flash) sit at or below the measured sibling. Every derived entry names
  its anchor in `note`. Relative order inside a tier is unresolved unless stated.
sources:
  FIZ_CAT: "fizeau v0.17.5 embedded catalog internal/modelcatalog/catalog/models.yaml (catalog_version 2026-05-08.1, generated 2026-04-27); module cache, read-only"
  FIZ_MAP: "fizeau v0.17.5 scripts/benchmark/terminalbench_model_power.json (committed 2026-05-06): Terminal-Bench-2 leaderboard submissions mapped to the 1..10 scale"
  FIZ_MASTER: "fizeau GitHub master checked 2026-10-16: both files identical to v0.17.5; no newer published measurements (latest release v0.17.5, 2026-09-21)"
  ERG_PRICES: "catalog/prices.yaml as_of 2026-10-16 (list prices used for derived ordering only)"

