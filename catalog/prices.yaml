databricks_gateway:
  # Live, read-only: GET /api/2.0/serving-endpoints/<name> (foundation_model.input_price / .price, 'DBUs per 1M tokens')
  # x system.billing.list_prices (pricing.default, USD per DBU). USD = DBU/MTok x USD/DBU.
  # Reconciled 2026-10-13 for databricks-claude-sonnet-5-5: gateway tokens x endpoint DBU rates = 36.05 DBU = system.billing.usage 36.0549 DBU.
  # system.ai_gateway.usage reports cache_read/cache_creation tokens as 0 for Anthropic traffic; no cache rate is published by the endpoint metadata.
  as_of: '2026-10-16'
  provenance: reported
  source: "databricks api get /api/2.0/serving-endpoints/<endpoint> + system.billing.list_prices (profile aidev-cus)"
  usd_per_dbu:
